[package]
name = "yomu"
version = "26.10.0"
edition = "2024"
rust-version = "1.92"
description = "A minimal, GPU-accelerated, Wayland-native manga reader with a library"
license = "MIT"

[lib]
name = "yomu"
path = "src/lib.rs"

[[bin]]
name = "yomu"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
# SIMD resampling for page and cover scaling (pure Rust, no C code): several times faster than the
# image crate's resize, which was the slowest step of showing a large page.
fast_image_resize = { version = "6", default-features = false, features = ["std"] }
# Pure-Rust decoders only: no C libraries get linked for image or archive handling.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["x86", "std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
memmap2 = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
unrar = "0.5.8"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = 1

[profile.test]
debug = 1

# Image decoding is painfully slow at opt-level 0, so optimise just those crates in dev builds.
[profile.dev.package.yomu]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

